name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
   backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestPass123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestPass123!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore backend/InventoryFlow.sln
      - name: Build
        run: dotnet build backend/InventoryFlow.sln --no-restore
      - name: Test Unit
        run: dotnet test backend/tests/InventoryFlow.UnitTests/InventoryFlow.UnitTests.csproj --no-build --no-restore
      - name: Test Application
        run: dotnet test backend/tests/InventoryFlow.Application.Tests/InventoryFlow.Application.Tests.csproj --no-build --no-restore
      - name: Verify formatting
        run: dotnet format backend/InventoryFlow.sln --verify-no-changes --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Unit Tests
        run: bun run test:run
